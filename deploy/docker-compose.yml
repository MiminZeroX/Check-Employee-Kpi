# AI Smart Office Monitoring & Workforce Management System
#   cp .env.example .env   # then edit the passwords / secrets
#   docker compose up -d --build
#   open http://SERVER_IP:8080
#
# HTTPS (recommended): set SITE_ADDRESS / TLS_MODE in .env, SERVER_PUBLISH=127.0.0.1:8080 and
# TRUST_PROXY=1, then: docker compose --profile https up -d   ->  https://SITE_ADDRESS
#
# The AI worker needs an API key: log in, open "Device Integration", add an "AI Worker"
# device, put the key into .env as AI_DEVICE_KEY and run:  docker compose --profile ai up -d

services:
  # MariaDB (MySQL-compatible) tuned for low RAM: ~70 MB instead of ~400 MB for a default MySQL 8.
  # To use MySQL 8.4 instead: image mysql:8.4 + MYSQL_* variables (the SQL is MySQL-compatible;
  # the test runs were done on MariaDB 10.11).
  mysql:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: smartoffice
      MARIADB_USER: smartoffice
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mariadb-lowmem.cnf:/etc/mysql/conf.d/zz-lowmem.cnf:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  # Restreams every camera once: WebRTC/MSE for browsers, RTSP for the AI worker.
  # SECURITY: go2rtc's API (1984) and RTSP (8554) have no authentication and the API can run
  # commands, so they are NOT published - only the server and AI worker reach them on the
  # internal network. Browsers watch through the server's authenticated /video proxy.
  # Only the WebRTC media port is published.
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    expose:
      - "1984"
      - "8554"
    ports:
      - "8555:8555/tcp"    # WebRTC media only (no API on this port)
      - "8555:8555/udp"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    mem_limit: 256m

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://smartoffice:${MYSQL_PASSWORD}@mysql:3306/smartoffice
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars) in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ_OFFSET_MINUTES: ${TZ_OFFSET_MINUTES:-420}
      GO2RTC_API: http://go2rtc:1984
      GO2RTC_RTSP: rtsp://go2rtc:8554
      WORKER_THREADS: ${SERVER_THREADS:-2}
      DB_MAX_CONNECTIONS: 5
      DATA_DIR: /var/lib/smartoffice
      DATA_KEY: ${DATA_KEY:?set DATA_KEY (openssl rand -hex 32) in .env}
      # 1 only when the server is reached through the Caddy proxy and not directly (see SERVER_PUBLISH)
      TRUST_PROXY: ${TRUST_PROXY:-0}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      MFA_ISSUER: ${MFA_ISSUER:-Smart Office}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
    volumes:
      - app-data:/var/lib/smartoffice
    ports:
      - "${SERVER_PUBLISH:-8080}:8080"
    mem_limit: 128m

  # HTTPS reverse proxy with automatic certificates (docker compose --profile https up -d)
  caddy:
    profiles: ["https"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [server]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 64m

  ai-worker:
    profiles: ["ai"]
    build: ../ai-worker
    restart: unless-stopped
    depends_on: [server, go2rtc]
    environment:
      SERVER_URL: http://server:8080
      DEVICE_KEY: ${AI_DEVICE_KEY:-}
      ORT_THREADS: ${AI_THREADS:-2}
      SIMULATE: ${AI_SIMULATE:-0}
      # yolox_nano.onnx (default, ~100 MB) or yolox_tiny.onnx (better at phones, ~125 MB;
      # build with --build-arg MODELS="nano tiny")
      MODEL_PATH: /app/models/${AI_MODEL:-yolox_nano.onnx}
      LOW_MEMORY: 1
      AI_BOOST_FPS: ${AI_BOOST_FPS:-8}
    # roughly 100 MB + 15 MB per camera; raise for many cameras
    mem_limit: ${AI_MEM_LIMIT:-512m}

volumes:
  mysql-data:
  app-data:
  caddy-data:
